<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的新聞儀表板</title><link rel="stylesheet" href="dashboard.css">
</head>
<body>
<header class="header">
  <div class="brand"><div class="mark">N</div><div><div class="kicker">PERSONAL NEWS DESK</div><h1>我的新聞儀表板</h1></div></div>
  <div class="header-right"><span id="clock"></span><span class="live"><i></i> 每小時更新</span><button id="refresh">↻ 更新</button></div>
</header>
<div class="layout">
<aside class="sidebar">
  <button class="nav active" data-view="home">⌂ <span>今日總覽</span></button>
  <button class="nav" data-view="latest">◷ <span>最新文章</span></button>
  <button class="nav" data-view="favorites">★ <span>收藏</span><b id="favCount">0</b></button>
  <div class="side-title">主題</div>
  <button class="tag" data-topic="政治">政治</button><button class="tag" data-topic="財經">財經</button><button class="tag" data-topic="社會">社會</button><button class="tag" data-topic="科技">科技</button><button class="tag" data-topic="地方">地方</button>
  <div class="side-title">來源</div><select id="sourceFilter"><option value="">全部媒體</option></select>
  <div class="hint">資料來源為你指定的記者／作者頁。閱讀全文會開啟原網站。</div>
</aside>
<main>
  <section id="overview" class="hero">
    <div><div class="date" id="date"></div><h2>今天發生了什麼？</h2><p>把你追蹤的記者最新文章集中在一個地方。</p></div>
    <div class="hero-stats"><div><strong id="total">0</strong><span>追蹤文章</span></div><div><strong id="media">0</strong><span>媒體</span></div><div><strong id="hours">0</strong><span>近 24 小時</span></div></div>
  </section>
  <section class="controls">
    <div class="search">⌕<input id="search" placeholder="搜尋標題、記者或媒體…"></div>
    <select id="sort"><option value="newest">最新優先</option><option value="oldest">最早優先</option></select>
  </section>
  <section id="topicSummary" class="topic-summary"></section>
  <section class="section-head"><h3 id="sectionTitle">最新文章</h3><span id="resultCount"></span></section>
  <section id="feed" class="feed"></section>
  <div id="empty" class="empty" hidden>目前沒有符合條件的文章。</div>
</main>
</div>
<footer>最後更新：<span id="lastUpdated">尚未載入</span>　·　新聞內容版權歸原媒體所有</footer>
<script src="dashboard.js"></script>
</body></html>
