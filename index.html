<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記者文章彙整站</title>
  <meta name="description" content="集中查看指定媒體與記者的最新文章，每小時自動更新。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">NEWS WATCH</div>
    <h1>記者文章彙整站</h1>
    <p class="sub">聯合新聞網・中時・中央社・三立・今周刊・天下・自由時報・台灣聲音等來源集中追蹤</p>
  </div>
  <div class="status">
    <span id="statusDot"></span>
    <span id="updated">讀取中…</span>
  </div>
</header>

<main>
  <section class="toolbar">
    <div class="search">
      <span>⌕</span>
      <input id="search" placeholder="搜尋標題、記者、來源…" autocomplete="off">
    </div>
    <select id="sourceFilter"><option value="">全部來源</option></select>
    <select id="sort"><option value="newest">最新發布</option><option value="oldest">最早發布</option></select>
    <button id="refresh">↻ 重新載入</button>
  </section>

  <section class="stats">
    <div><strong id="count">0</strong><span>篇文章</span></div>
    <div><strong id="sourceCount">0</strong><span>個來源</span></div>
    <div><strong>60</strong><span>分鐘更新</span></div>
  </section>

  <section id="feed" class="feed"></section>
  <div id="empty" class="empty" hidden>找不到符合條件的文章。</div>
</main>

<footer>
  <span>資料僅顯示文章標題、來源、時間與連結；閱讀全文請前往原網站。</span>
  <span id="lastRun"></span>
</footer>
<script src="app.js"></script>
</body>
</html>
